name: Publish

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write # Needed for GitHub publishing
    runs-on: ubuntu-latest
    steps:
      - name: Validate
        uses: quintenroets/actions/validate/bun@main

      - name: Publish bun project to GitHub
        uses: quintenroets/actions/publish/bun@main
